[build]
  command   = "npm run build && curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o node_modules/youtube-dl-exec/bin/yt-dlp && chmod +x node_modules/youtube-dl-exec/bin/yt-dlp"
  publish   = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler         = "esbuild"
  external_node_modules = ["youtube-dl-exec"]
  included_files       = ["node_modules/youtube-dl-exec/bin/**"]

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
