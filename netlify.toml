[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

[functions]
  node_bundler         = "esbuild"
  external_node_modules = ["youtube-dl-exec"]
  included_files       = ["node_modules/youtube-dl-exec/bin/**"]

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
